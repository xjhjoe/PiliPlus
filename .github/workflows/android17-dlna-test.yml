name: Android 17 DLNA test APK

on:
  push:
    branches:
      - fix/android17-dlna-permission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply project patches and fetch dependencies
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Set build version
        shell: pwsh
        run: lib/scripts/build.ps1 android
      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=pili_release.json --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-Android17-DLNA-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
