name: AutoNext 2.2.0.2 stable-signature Android

on:
  push:
    branches:
      - feature/2.2.0.2-autonext-playlist
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply Android patches and fetch dependencies
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Set build version
        shell: pwsh
        run: lib/scripts/build.ps1 android
      - name: Check permanent signing secrets
        id: signing
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SIGN_KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No persistent signing keystore is configured. Running compile-only check; no APK will be released."
            exit 0
          fi
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/autonext-release.jks
          test -s android/app/autonext-release.jks
          printf 'storeFile=autonext-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/key.properties android/app/autonext-release.jks
          echo "signing=true" >> "$GITHUB_OUTPUT"
      - name: Compile-only APK check (not distributed)
        if: steps.signing.outputs.signing != 'true'
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --android-project-arg dev=1 \
            --dart-define-from-file=pili_release.json --no-pub
          echo "::notice::Compilation succeeded. Configure signing secrets to publish a stable-signature APK."
      - name: Build persistent-signature Playlist APK
        if: steps.signing.outputs.signing == 'true'
        run: |
          code=$((220020200 + GITHUB_RUN_NUMBER))
          flutter build apk --release --target-platform android-arm64 \
            --android-project-arg dev=1 --android-project-arg fixedSigning=1 \
            --build-number "$code" \
            --dart-define-from-file=pili_release.json --no-pub
      - name: Publish signed APK to GitHub Releases
        if: steps.signing.outputs.signing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="PiliPlus-2.2.0.2-AutoNext-Playlist-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          tag="autonext-2.2.0.2-signed-v${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "PiliPlus 2.2.0.2 AutoNext + Playlist (signed)" \
            --notes "Unofficial arm64 version based on upstream PiliPlus 2.2.0.2. Uses the stable keystore configured in this repository and the same package ID as the earlier Playlist v3: com.example.piliplus.dev.autonextplaylist. IMPORTANT: earlier v3 was signed by an ephemeral debug key and cannot be upgraded in place without that exact private key. After one-time migration to this fixed signature, future builds signed with the same keystore can upgrade in place."
