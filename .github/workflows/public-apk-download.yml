name: Publish public AutoNext APK download

on:
  push:
    branches:
      - feature/2.2.0-dlna-autonext
    paths:
      - .github/workflows/public-apk-download.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download previously built and verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 41298552943 \
            --repo "${{ github.repository }}" \
            --name PiliPlus-2.2-AutoNext-arm64 \
            --dir dist
          test -s dist/app-release.apk
          mv dist/app-release.apk dist/PiliPlus-2.2-AutoNext-arm64.apk
          ls -lh dist/PiliPlus-2.2-AutoNext-arm64.apk
      - name: Publish permanent public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create autonext-2.2.0-test1 \
            dist/PiliPlus-2.2-AutoNext-arm64.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "PiliPlus 2.2 AutoNext test APK" \
            --notes "Unofficial Android arm64 test build based on PiliPlus 2.2.0. Supports DLNA auto-next episodes and manual playback controls. Uses separate package ID; no need to uninstall official PiliPlus. This is a test build, not the upstream official release."
