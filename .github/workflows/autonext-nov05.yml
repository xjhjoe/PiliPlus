name: November 5 AutoNext Playlist APK

on:
  push:
    branches:
      - feature/20261105-autonext-upstream
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply project patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Generate app version
        shell: pwsh
        run: lib/scripts/build.ps1 android
      - name: Build APK based on newest official main
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --android-project-arg dev=1 \
            --android-project-arg novemberTest=1 \
            --dart-define-from-file=pili_release.json --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-Nov05-AutoNext-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PiliPlus-Nov05-AutoNext-Playlist-arm64.apk
          gh release create autonext-nov05-2026-v1 \
            PiliPlus-Nov05-AutoNext-Playlist-arm64.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "PiliPlus November 5 AutoNext + Playlist" \
            --notes "Unofficial Android arm64 test APK based on upstream main e3aff443 (2026-11-05). Includes AutoNext, episode playlist and DLNA fallbacks. Independent package com.example.piliplus.dev.autonextnov05, cannot directly upgrade earlier builds signed by different CI keys. Save app data via export before migrating."
