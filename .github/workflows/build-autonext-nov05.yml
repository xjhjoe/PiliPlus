name: Build Latest AutoNext Playlist ARM64

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-autonext-nov05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/20261113-autonext-playlist
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Generate build version
        shell: pwsh
        run: lib/scripts/build.ps1 android
      - name: Build ARM64 APK
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --android-project-arg dev=1 \
            --android-project-arg autonextNov13=1 \
            --dart-define-from-file=pili_release.json --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: PiliPlus-20261113-AutoNext-Playlist-ARM64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish APK with public direct download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PiliPlus-20261113-AutoNext-Playlist-arm64.apk
          gh release create autonext-20261113-v1 \
            PiliPlus-Nov05-AutoNext-Playlist-arm64.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "PiliPlus Nov 13 AutoNext + Playlist" \
            --notes "Unofficial Android ARM64 build using November 13 upstream 9999f21d plus DLNA AutoNext and playlist. Cast devices are shown above the playlist. Independent package com.example.piliplus.dev.autonextnov13, signed with ephemeral CI debug keys and not guaranteed to upgrade prior builds."
