name: Build LeftTopCast TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated LeftTopCast feature
        uses: actions/checkout@v4
        with:
          ref: feature/lefttopcast-dlna-tv

      - name: Checkout upstream LeanCast
        uses: actions/checkout@v4
        with:
          repository: addozhang/leancast
          ref: main
          path: leancast

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Patch safe-area player
        run: python3 lefttopcast/apply.py

      - name: Accept SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        working-directory: leancast
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp leancast/app/build/outputs/apk/debug/app-debug.apk LeftTopCast-TV-DLNA-v1.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeftTopCast-TV-DLNA-v1
          path: LeftTopCast-TV-DLNA-v1.apk
          if-no-files-found: error

      - name: Publish APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create lefttopcast-tv-v1 LeftTopCast-TV-DLNA-v1.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "LeftTopCast TV DLNA receiver v1" \
            --notes "Test build for Android TV 5+. Separate application io.lefttopcast.tv. Based on LeanCast (Apache-2.0). Remote controls safe area, default 75% by 75%. Does not change Android-wide display." \
            --prerelease
